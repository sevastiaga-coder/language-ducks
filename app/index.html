<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Ducks — вход</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="phone-body">
<div class="phone-screen">
  <h1 class="phone-title">LANGUAGE DUCKS</h1>

  <div id="join-view" class="join-view">
    <label class="field-label" for="name-input">Как тебя зовут?</label>
    <input id="name-input" class="name-input" type="text" maxlength="12" autocomplete="off" placeholder="Твоё имя">
    <button id="join-btn" class="primary-btn" disabled>ИГРАТЬ</button>
    <div id="join-hint" class="join-hint"></div>
  </div>

  <div id="closed-view" class="waiting-view" hidden>
    <div class="waiting-text">Игра уже идёт, попробуй в следующий раз</div>
  </div>

  <div id="waiting-view" class="waiting-view" hidden>
    <div class="waiting-name">Ты играешь как <span id="player-name-label"></span></div>
    <div class="waiting-text" id="waiting-status">Смотри на большой экран</div>

    <div id="host-controls" class="host-controls" hidden>
      <button id="start-btn" class="primary-btn" disabled>НАЧАТЬ ИГРУ</button>
      <div id="start-hint" class="join-hint"></div>
    </div>

    <div id="guest-note" class="guest-note" hidden>Игру начнёт тот, кто зашёл первым</div>
  </div>

  <div id="answer-view" class="answer-view" hidden>
    <div class="waiting-name">Ты играешь как <span id="answer-player-name"></span></div>
    <div class="question-number" id="answer-question-number"></div>
    <div class="task-line">Переведи: <span id="task-word" class="task-word"></span></div>
    <div class="task-language" id="task-language"></div>
    <input id="answer-input" class="name-input" type="text" maxlength="40" autocomplete="off" placeholder="Твой перевод">
    <button id="answer-btn" class="primary-btn" disabled>ОТВЕТИТЬ</button>
    <div class="answered-count" id="phone-answered-count"></div>
  </div>

  <div id="submitted-view" class="waiting-view" hidden>
    <div class="waiting-name">Ты играешь как <span id="submitted-player-name"></span></div>
    <div class="submitted-check" id="submitted-check">✓</div>
    <div class="points-earned" id="points-earned" hidden></div>
    <div class="waiting-text" id="submitted-status">Ответ принят, жди остальных</div>
    <div class="submitted-answer" id="submitted-answer-text"></div>
    <div class="answered-count" id="submitted-answered-count"></div>
    <div class="my-score-line" id="my-score-line" hidden></div>
    <div class="my-score-line" id="my-rank-line" hidden></div>
  </div>

  <div id="final-view" class="waiting-view" hidden>
    <div class="waiting-name">Ты играешь как <span id="final-player-name"></span></div>
    <div class="waiting-text">Игра окончена!</div>
    <div class="my-score-line" id="final-score-line"></div>
    <div class="my-score-line" id="final-rank-line"></div>

    <div id="final-host-controls" class="host-controls" hidden>
      <button id="restart-btn" class="primary-btn">СЫГРАТЬ ЕЩЁ РАЗ</button>
      <div id="restart-hint" class="join-hint"></div>
    </div>

    <div id="final-guest-note" class="guest-note" hidden>Ведущий может начать новую игру</div>
  </div>
</div>

<script src="app.js"></script>
<script>
  const nameInput = document.getElementById("name-input");
  const joinBtn = document.getElementById("join-btn");
  const joinHint = document.getElementById("join-hint");
  const joinView = document.getElementById("join-view");
  const closedView = document.getElementById("closed-view");
  const waitingView = document.getElementById("waiting-view");
  const answerView = document.getElementById("answer-view");
  const submittedView = document.getElementById("submitted-view");
  const finalView = document.getElementById("final-view");
  const playerNameLabel = document.getElementById("player-name-label");
  const waitingStatus = document.getElementById("waiting-status");
  const hostControls = document.getElementById("host-controls");
  const startBtn = document.getElementById("start-btn");
  const startHint = document.getElementById("start-hint");
  const guestNote = document.getElementById("guest-note");

  const answerPlayerName = document.getElementById("answer-player-name");
  const answerQuestionNumber = document.getElementById("answer-question-number");
  const taskWord = document.getElementById("task-word");
  const taskLanguage = document.getElementById("task-language");
  const answerInput = document.getElementById("answer-input");
  const answerBtn = document.getElementById("answer-btn");
  const phoneAnsweredCount = document.getElementById("phone-answered-count");

  const submittedPlayerName = document.getElementById("submitted-player-name");
  const submittedCheck = document.getElementById("submitted-check");
  const pointsEarned = document.getElementById("points-earned");
  const submittedStatus = document.getElementById("submitted-status");
  const submittedAnswerText = document.getElementById("submitted-answer-text");
  const submittedAnsweredCount = document.getElementById("submitted-answered-count");
  const myScoreLine = document.getElementById("my-score-line");
  const myRankLine = document.getElementById("my-rank-line");

  const finalPlayerName = document.getElementById("final-player-name");
  const finalScoreLine = document.getElementById("final-score-line");
  const finalRankLine = document.getElementById("final-rank-line");
  const finalHostControls = document.getElementById("final-host-controls");
  const finalGuestNote = document.getElementById("final-guest-note");
  const restartBtn = document.getElementById("restart-btn");
  const restartHint = document.getElementById("restart-hint");

  let myPlayerId = null;
  let pollTimer = null;
  // Помогает понять, что вопрос реально сменился, и только тогда
  // очистить поле ввода — иначе каждый опрос стирал бы то, что
  // игрок сейчас печатает.
  let currentWordIndex = null;

  function hideAllViews() {
    joinView.hidden = true;
    closedView.hidden = true;
    waitingView.hidden = true;
    answerView.hidden = true;
    submittedView.hidden = true;
    finalView.hidden = true;
  }

  function showJoinForm() {
    hideAllViews();
    joinView.hidden = false;
  }

  function showClosed() {
    hideAllViews();
    closedView.hidden = false;
  }

  function renderLobby(info) {
    hideAllViews();
    waitingView.hidden = false;
    waitingStatus.textContent = "Смотри на большой экран";
    if (info.isHost) {
      hostControls.hidden = false;
      guestNote.hidden = true;
      startBtn.disabled = info.playerCount < 2;
      startHint.textContent = info.playerCount < 2 ? "Нужен ещё хотя бы один игрок" : "";
    } else {
      hostControls.hidden = true;
      guestNote.hidden = false;
    }
  }

  function renderAnswerView(info) {
    hideAllViews();
    answerView.hidden = false;
    answerQuestionNumber.textContent = "Слово " + info.wordIndex + " из " + info.wordTotal;
    taskWord.textContent = info.word || "";
    taskLanguage.textContent = info.wordLanguage ? "язык: " + info.wordLanguage : "";

    if (currentWordIndex !== info.wordIndex) {
      currentWordIndex = info.wordIndex;
      answerInput.value = "";
      answerBtn.disabled = true;
    }
    phoneAnsweredCount.textContent = "Ответили " + info.answeredCount + " из " + info.playerCount;
  }

  function renderSubmittedView(info) {
    hideAllViews();
    submittedView.hidden = false;
    submittedAnswerText.textContent = info.myAnswered ? (info.myAnswerText || "") : "";
    submittedAnsweredCount.textContent = "Ответили " + info.answeredCount + " из " + info.playerCount;

    if (!info.revealed) {
      submittedCheck.hidden = false;
      submittedCheck.textContent = "✓";
      submittedCheck.classList.remove("wrong");
      submittedStatus.textContent = "Ответ принят, жди остальных";
      pointsEarned.hidden = true;
      myScoreLine.hidden = true;
      myRankLine.hidden = true;
      return;
    }

    // Слово раскрыто — главное теперь начисление очков, а не галочка.
    submittedCheck.hidden = true;
    pointsEarned.hidden = false;
    pointsEarned.textContent = "+" + info.myPoints;
    pointsEarned.classList.toggle("zero", info.myPoints === 0);

    if (!info.myAnswered) {
      submittedStatus.textContent = "Ты не успел ответить";
    } else if (info.myCorrect) {
      submittedStatus.textContent = "Ты угадал!";
    } else {
      submittedStatus.textContent = "Мимо";
    }

    myScoreLine.hidden = false;
    myScoreLine.textContent = "Твои очки: " + info.myScore;
    myRankLine.hidden = false;
    myRankLine.textContent = "Ты на " + info.myRank + " месте";
  }

  function renderFinalView(info) {
    hideAllViews();
    finalView.hidden = false;
    finalScoreLine.textContent = "Твои очки: " + info.myScore;
    finalRankLine.textContent = "Ты на " + info.myRank + " месте";
    if (info.isHost) {
      finalHostControls.hidden = false;
      finalGuestNote.hidden = true;
    } else {
      finalHostControls.hidden = true;
      finalGuestNote.hidden = false;
    }
  }

  // Решает, какой экран телефона показать прямо сейчас, по свежим
  // данным с сервера.
  function renderPhase(info) {
    if (info.phase === "final") {
      renderFinalView(info);
      return;
    }
    if (info.phase === "playing") {
      if (info.myAnswered || info.revealed) {
        renderSubmittedView(info);
      } else {
        renderAnswerView(info);
      }
    } else {
      renderLobby(info);
    }
  }

  function startPolling() {
    if (pollTimer) {
      return;
    }
    pollTimer = setInterval(async () => {
      try {
        const info = await fetchGameInfo(myPlayerId);
        renderPhase(info);
      } catch (error) {
        // Сервер на секунду недоступен — просто попробуем ещё раз через секунду.
      }
    }, 1000);
  }

  function enterGame(name) {
    playerNameLabel.textContent = name;
    answerPlayerName.textContent = name;
    submittedPlayerName.textContent = name;
    finalPlayerName.textContent = name;
    startPolling();
  }

  nameInput.addEventListener("input", () => {
    joinBtn.disabled = nameInput.value.trim().length === 0;
    joinHint.textContent = "";
  });

  async function join() {
    const name = nameInput.value.trim();
    if (!name) {
      return;
    }
    joinBtn.disabled = true;
    const savedId = sessionStorage.getItem("playerId");
    const result = await joinGame({ id: savedId, name: name });
    if (result.ok) {
      myPlayerId = result.id;
      sessionStorage.setItem("playerId", result.id);
      sessionStorage.setItem("playerName", result.name);
      enterGame(result.name);
      const info = await fetchGameInfo(myPlayerId);
      renderPhase(info);
    } else {
      joinHint.textContent = result.error;
      joinBtn.disabled = false;
    }
  }

  joinBtn.addEventListener("click", join);
  nameInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !joinBtn.disabled) {
      join();
    }
  });

  startBtn.addEventListener("click", async () => {
    startBtn.disabled = true;
    const result = await startGame(myPlayerId);
    if (!result.ok) {
      startHint.textContent = result.error;
      startBtn.disabled = false;
    }
  });

  answerInput.addEventListener("input", () => {
    answerBtn.disabled = answerInput.value.trim().length === 0;
  });

  async function submitAnswer() {
    const answer = answerInput.value.trim();
    if (!answer) {
      return;
    }
    answerBtn.disabled = true;
    const result = await sendAnswer(myPlayerId, answer);
    if (result.ok) {
      const info = await fetchGameInfo(myPlayerId);
      renderPhase(info);
    } else {
      answerBtn.disabled = false;
    }
  }

  answerBtn.addEventListener("click", submitAnswer);
  answerInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !answerBtn.disabled) {
      submitAnswer();
    }
  });

  restartBtn.addEventListener("click", async () => {
    restartBtn.disabled = true;
    const result = await restartGame(myPlayerId);
    if (result.ok) {
      currentWordIndex = null;
    } else {
      restartHint.textContent = result.error;
      restartBtn.disabled = false;
    }
  });

  async function init() {
    const savedId = sessionStorage.getItem("playerId");
    if (savedId) {
      const result = await joinGame({ id: savedId });
      if (result.ok) {
        myPlayerId = savedId;
        enterGame(result.name);
        const info = await fetchGameInfo(myPlayerId);
        renderPhase(info);
        return;
      }
      sessionStorage.removeItem("playerId");
      sessionStorage.removeItem("playerName");
    }

    const info = await fetchGameInfo();
    if (info.phase !== "lobby") {
      showClosed();
      return;
    }
    showJoinForm();
  }

  init();
</script>
</body>
</html>
