<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Ducks — вход</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="phone-body">
<div class="phone-screen">
  <h1 class="phone-title">LANGUAGE DUCKS</h1>

  <div id="join-view" class="join-view">
    <label class="field-label" for="name-input">Как тебя зовут?</label>
    <input id="name-input" class="name-input" type="text" maxlength="12" autocomplete="off" placeholder="Твоё имя">
    <button id="join-btn" class="primary-btn" disabled>ИГРАТЬ</button>
    <div id="join-hint" class="join-hint"></div>
  </div>

  <div id="closed-view" class="waiting-view" hidden>
    <div class="waiting-text">Игра уже идёт, попробуй в следующий раз</div>
  </div>

  <div id="waiting-view" class="waiting-view" hidden>
    <div class="waiting-name">Ты играешь как <span id="player-name-label"></span></div>
    <div class="waiting-text" id="waiting-status">Смотри на большой экран</div>

    <div id="host-controls" class="host-controls" hidden>
      <button id="start-btn" class="primary-btn" disabled>НАЧАТЬ ИГРУ</button>
      <div id="start-hint" class="join-hint"></div>
    </div>

    <div id="guest-note" class="guest-note" hidden>Игру начнёт тот, кто зашёл первым</div>
  </div>
</div>

<script src="app.js"></script>
<script>
  const nameInput = document.getElementById("name-input");
  const joinBtn = document.getElementById("join-btn");
  const joinHint = document.getElementById("join-hint");
  const joinView = document.getElementById("join-view");
  const closedView = document.getElementById("closed-view");
  const waitingView = document.getElementById("waiting-view");
  const playerNameLabel = document.getElementById("player-name-label");
  const waitingStatus = document.getElementById("waiting-status");
  const hostControls = document.getElementById("host-controls");
  const startBtn = document.getElementById("start-btn");
  const startHint = document.getElementById("start-hint");
  const guestNote = document.getElementById("guest-note");

  let myPlayerId = null;
  let pollTimer = null;

  function showJoinForm() {
    joinView.hidden = false;
    closedView.hidden = true;
    waitingView.hidden = true;
  }

  function showClosed() {
    joinView.hidden = true;
    closedView.hidden = false;
    waitingView.hidden = true;
  }

  function showWaiting(name) {
    playerNameLabel.textContent = name;
    joinView.hidden = true;
    closedView.hidden = true;
    waitingView.hidden = false;
    startPolling();
  }

  // Показывает, что сейчас происходит: ждём хода хозяина, или игра уже пошла.
  function renderWaitingState(info) {
    if (info.phase === "playing") {
      waitingStatus.textContent = "Жди задание";
      hostControls.hidden = true;
      guestNote.hidden = true;
      return;
    }
    waitingStatus.textContent = "Смотри на большой экран";
    if (info.isHost) {
      hostControls.hidden = false;
      guestNote.hidden = true;
      startBtn.disabled = info.playerCount < 2;
      startHint.textContent = info.playerCount < 2 ? "Нужен ещё хотя бы один игрок" : "";
    } else {
      hostControls.hidden = true;
      guestNote.hidden = false;
    }
  }

  function startPolling() {
    if (pollTimer) {
      return;
    }
    pollTimer = setInterval(async () => {
      try {
        const info = await fetchGameInfo(myPlayerId);
        renderWaitingState(info);
      } catch (error) {
        // Сервер на секунду недоступен — просто попробуем ещё раз через секунду.
      }
    }, 1000);
  }

  nameInput.addEventListener("input", () => {
    joinBtn.disabled = nameInput.value.trim().length === 0;
    joinHint.textContent = "";
  });

  async function join() {
    const name = nameInput.value.trim();
    if (!name) {
      return;
    }
    joinBtn.disabled = true;
    const savedId = sessionStorage.getItem("playerId");
    const result = await joinGame({ id: savedId, name: name });
    if (result.ok) {
      myPlayerId = result.id;
      sessionStorage.setItem("playerId", result.id);
      sessionStorage.setItem("playerName", result.name);
      const info = await fetchGameInfo(myPlayerId);
      showWaiting(result.name);
      renderWaitingState(info);
    } else {
      joinHint.textContent = result.error;
      joinBtn.disabled = false;
    }
  }

  joinBtn.addEventListener("click", join);
  nameInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !joinBtn.disabled) {
      join();
    }
  });

  startBtn.addEventListener("click", async () => {
    startBtn.disabled = true;
    const result = await startGame(myPlayerId);
    if (!result.ok) {
      startHint.textContent = result.error;
      startBtn.disabled = false;
    }
  });

  async function init() {
    const savedId = sessionStorage.getItem("playerId");
    if (savedId) {
      const result = await joinGame({ id: savedId });
      if (result.ok) {
        myPlayerId = savedId;
        const info = await fetchGameInfo(myPlayerId);
        showWaiting(result.name);
        renderWaitingState(info);
        return;
      }
      sessionStorage.removeItem("playerId");
      sessionStorage.removeItem("playerName");
    }

    const info = await fetchGameInfo();
    if (info.phase !== "lobby") {
      showClosed();
      return;
    }
    showJoinForm();
  }

  init();
</script>
</body>
</html>
