<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Ducks — экран</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <h1 class="game-title">LANGUAGE DUCKS</h1>

  <div class="join-panel">
    <div class="join-address" id="join-address">...</div>
    <div class="join-hint">Зайди с телефона по этому адресу</div>
  </div>

  <div class="players-panel" id="players-panel">
    <div class="players-waiting">Ждём игроков</div>
    <div class="players-grid" id="players-grid"></div>
    <div class="players-count" id="players-count">Игроков: 0 из 10</div>
  </div>

  <div class="playing-panel" id="playing-panel" hidden>
    <div class="playing-announcement">ИГРА НАЧАЛАСЬ</div>
  </div>
</div>

<script src="app.js"></script>
<script>
  const MAX_PLAYERS = 10;
  let previousNames = new Set();

  function renderPlayers(names) {
    const grid = document.getElementById("players-grid");
    grid.innerHTML = "";
    for (let i = 0; i < MAX_PLAYERS; i++) {
      const slot = document.createElement("div");
      if (i < names.length) {
        const name = names[i];
        slot.className = "player-slot filled" + (previousNames.has(name) ? "" : " appear");
        slot.textContent = name;
      } else {
        slot.className = "player-slot";
      }
      grid.appendChild(slot);
    }
    previousNames = new Set(names);
  }

  async function updateInfo() {
    try {
      const info = await fetchGameInfo();
      const joinPanel = document.querySelector(".join-panel");
      const playersPanel = document.getElementById("players-panel");
      const playingPanel = document.getElementById("playing-panel");

      if (info.phase === "playing") {
        joinPanel.hidden = true;
        playersPanel.hidden = true;
        playingPanel.hidden = false;
        return;
      }

      joinPanel.hidden = false;
      playersPanel.hidden = false;
      playingPanel.hidden = true;
      document.getElementById("join-address").textContent = info.address;
      document.getElementById("players-count").textContent =
        "Игроков: " + info.playerCount + " из " + MAX_PLAYERS;
      renderPlayers(info.players);
    } catch (error) {
      document.getElementById("join-address").textContent = "нет связи с сервером";
    }
  }

  renderPlayers([]);
  updateInfo();
  setInterval(updateInfo, 1000);
</script>
</body>
</html>
