<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Ducks — экран</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <h1 class="game-title" id="game-title">LANGUAGE DUCKS</h1>

  <div class="join-panel">
    <div class="join-address" id="join-address">...</div>
    <div class="join-hint">Зайди с телефона по этому адресу</div>
  </div>

  <div class="players-panel" id="players-panel">
    <div class="players-waiting">Ждём игроков</div>
    <div class="players-grid" id="players-grid"></div>
    <div class="players-count" id="players-count">Игроков: 0 из 10</div>
  </div>

  <div class="playing-panel" id="playing-panel" hidden>
    <div class="stage-badge">ЭТАП 1 · ПЕРЕВОД</div>
    <div class="question-number" id="question-number"></div>
    <div class="word" id="word-text"></div>
    <div class="word-language" id="word-language"></div>
    <div class="answered-list" id="answered-list"></div>
    <div class="answered-count" id="answered-count"></div>
    <div class="all-answered-note" id="all-answered-note" hidden>Все ответили!</div>
  </div>

  <div class="reveal-panel" id="reveal-panel" hidden>
    <div class="reveal-header">
      <div class="reveal-word" id="reveal-word"></div>
      <div class="word-language" id="reveal-language"></div>
      <div class="reveal-correct">Правильный перевод: <span id="reveal-correct-answer"></span></div>
    </div>
    <div class="reveal-body">
      <div class="reveal-cards" id="reveal-cards"></div>
      <div class="reveal-side">
        <div class="scoreboard" id="scoreboard"></div>
      </div>
    </div>
    <div class="next-word-note">Следующее слово через несколько секунд</div>
  </div>

  <div class="final-panel" id="final-panel" hidden>
    <div class="winner-label" id="winner-label">ПОБЕДИТЕЛЬ</div>
    <div class="winner-name word" id="winner-name"></div>
    <div class="winner-score" id="winner-score"></div>
    <div class="final-standings" id="final-standings"></div>
    <div class="final-note">Ведущий может начать новую игру со своего телефона</div>
  </div>
</div>

<script src="app.js"></script>
<script>
  const MAX_PLAYERS = 10;
  let previousNames = new Set();
  // Запоминаем, что уже нарисовано на экране, чтобы не пересоздавать
  // те же самые карточки заново каждую секунду — из-за этого они мигали.
  let lastPlayersKey = null;
  let lastAnsweredKey = null;
  let lastRevealKey = null;
  let lastFinalKey = null;

  function renderPlayers(names) {
    const key = names.join("|");
    if (key === lastPlayersKey) {
      return;
    }
    lastPlayersKey = key;

    const grid = document.getElementById("players-grid");
    grid.innerHTML = "";
    for (let i = 0; i < MAX_PLAYERS; i++) {
      const slot = document.createElement("div");
      if (i < names.length) {
        const name = names[i];
        slot.className = "player-slot filled" + (previousNames.has(name) ? "" : " appear");
        slot.textContent = name;
      } else {
        slot.className = "player-slot";
      }
      grid.appendChild(slot);
    }
    previousNames = new Set(names);
  }

  async function updateInfo() {
    try {
      const info = await fetchGameInfo();
      const joinPanel = document.querySelector(".join-panel");
      const playersPanel = document.getElementById("players-panel");
      const playingPanel = document.getElementById("playing-panel");
      const revealPanel = document.getElementById("reveal-panel");
      const finalPanel = document.getElementById("final-panel");

      // Логотип во весь рост нужен только пока собираем игроков (Л1) —
      // на игровых экранах он мельче и без свечения, чтобы не спорить
      // за внимание с главным содержимым.
      const gameTitle = document.getElementById("game-title");
      gameTitle.classList.toggle("small", info.phase === "playing" || info.phase === "final");

      if (info.phase === "final") {
        joinPanel.hidden = true;
        playersPanel.hidden = true;
        playingPanel.hidden = true;
        revealPanel.hidden = true;
        finalPanel.hidden = false;
        renderFinal(info);
        return;
      }

      if (info.phase === "playing" && info.revealed) {
        joinPanel.hidden = true;
        playersPanel.hidden = true;
        playingPanel.hidden = true;
        revealPanel.hidden = false;
        finalPanel.hidden = true;
        renderReveal(info);
        return;
      }

      if (info.phase === "playing") {
        joinPanel.hidden = true;
        playersPanel.hidden = true;
        playingPanel.hidden = false;
        revealPanel.hidden = true;
        finalPanel.hidden = true;
        renderWord(info);
        return;
      }

      joinPanel.hidden = false;
      playersPanel.hidden = false;
      playingPanel.hidden = true;
      revealPanel.hidden = true;
      finalPanel.hidden = true;
      document.getElementById("join-address").textContent = info.address;
      document.getElementById("players-count").textContent =
        "Игроков: " + info.playerCount + " из " + MAX_PLAYERS;
      renderPlayers(info.players);
    } catch (error) {
      document.getElementById("join-address").textContent = "нет связи с сервером";
    }
  }

  // Украинские и белорусские слова задания написаны кириллицей, которой
  // нет в Orbitron — без этой проверки они падали бы в запасной шрифт
  // и не совпадали бы с Rubik вокруг.
  function isCyrillic(text) {
    return /\p{Script=Cyrillic}/u.test(text || "");
  }

  function renderWord(info) {
    document.getElementById("question-number").textContent =
      "Слово " + info.wordIndex + " из " + info.wordTotal;
    const wordEl = document.getElementById("word-text");
    wordEl.textContent = info.word || "";
    wordEl.classList.toggle("cyr", isCyrillic(info.word));
    document.getElementById("word-language").textContent = info.wordLanguage || "";

    const answeredKey = info.wordIndex + "|" + info.players.join(",") + "|" +
      info.answeredNames.slice().sort().join(",");
    if (answeredKey !== lastAnsweredKey) {
      lastAnsweredKey = answeredKey;
      const answeredList = document.getElementById("answered-list");
      answeredList.innerHTML = "";
      info.players.forEach((name) => {
        const item = document.createElement("div");
        const answered = info.answeredNames.includes(name);
        item.className = "answered-name" + (answered ? " answered" : "");
        item.textContent = (answered ? "✓ " : "") + name;
        answeredList.appendChild(item);
      });
    }

    document.getElementById("answered-count").textContent =
      "Ответили " + info.answeredCount + " из " + info.players.length;
    document.getElementById("all-answered-note").hidden = !info.allAnswered;
  }

  function renderReveal(info) {
    const revealWordEl = document.getElementById("reveal-word");
    revealWordEl.textContent = info.word || "";
    revealWordEl.classList.toggle("cyr", isCyrillic(info.word));
    document.getElementById("reveal-language").textContent = info.wordLanguage || "";
    document.getElementById("reveal-correct-answer").textContent = info.correctAnswer || "";

    // Пересоздаём карточки и таблицу очков только когда слово или сами
    // ответы реально изменились — иначе анимация появления
    // перезапускалась бы каждую секунду опроса сервера, и карточки мигали.
    const revealKey = info.word + "|" + JSON.stringify(info.results) + "|" + JSON.stringify(info.scoreboard);
    if (revealKey === lastRevealKey) {
      return;
    }
    lastRevealKey = revealKey;

    const cardsContainer = document.getElementById("reveal-cards");
    cardsContainer.innerHTML = "";
    // При пяти игроках и больше карточки не помещаются в один
    // столбец на экране ноутбука — раскладываем в два.
    cardsContainer.classList.toggle("two-col", info.results.length > 4);
    info.results.forEach((result, index) => {
      const card = document.createElement("div");
      card.className = "answer-card" + (!result.answered ? " missing" : result.correct ? " correct" : "");
      card.style.animationDelay = (index * 150) + "ms";

      const info_block = document.createElement("div");
      info_block.className = "answer-card-info";
      const nameEl = document.createElement("div");
      nameEl.className = "answer-card-name";
      nameEl.textContent = result.name;
      const textEl = document.createElement("div");
      textEl.className = "answer-card-text";
      textEl.textContent = result.answered ? result.answer : "нет ответа";
      info_block.appendChild(nameEl);
      info_block.appendChild(textEl);

      const right = document.createElement("div");
      right.className = "answer-card-right";

      const verdict = document.createElement("div");
      verdict.className = "answer-card-verdict";
      if (!result.answered) {
        verdict.textContent = "НЕТ ОТВЕТА";
      } else if (result.correct) {
        verdict.textContent = "ВЕРНО";
      }

      const points = document.createElement("div");
      points.className = "answer-card-points" + (result.points > 0 ? "" : " zero");
      points.textContent = "+" + result.points;

      right.appendChild(verdict);
      right.appendChild(points);

      card.appendChild(info_block);
      card.appendChild(right);
      cardsContainer.appendChild(card);
    });

    const scoreboardContainer = document.getElementById("scoreboard");
    scoreboardContainer.innerHTML = "";
    const topScore = info.scoreboard.length ? info.scoreboard[0].score : -1;
    info.scoreboard.forEach((entry) => {
      const row = document.createElement("div");
      row.className = "scoreboard-row" + (entry.score === topScore ? " leader" : "");
      const nameEl = document.createElement("div");
      nameEl.textContent = entry.name;
      const scoreEl = document.createElement("div");
      scoreEl.className = "scoreboard-score";
      scoreEl.textContent = entry.score;
      row.appendChild(nameEl);
      row.appendChild(scoreEl);
      scoreboardContainer.appendChild(row);
    });
  }

  function renderFinal(info) {
    // Пересоздаём только когда таблица очков реально изменилась —
    // тот же трюк, что и в renderReveal, чтобы экран не мигал.
    const finalKey = JSON.stringify(info.scoreboard);
    if (finalKey === lastFinalKey) {
      return;
    }
    lastFinalKey = finalKey;

    const standings = info.scoreboard;
    const winners = standings.filter((entry) => entry.rank === 1);

    document.getElementById("winner-label").textContent =
      winners.length > 1 ? "ПОБЕДИТЕЛИ" : "ПОБЕДИТЕЛЬ";
    document.getElementById("winner-name").textContent =
      winners.map((winner) => winner.name).join(" и ");
    document.getElementById("winner-score").textContent =
      winners.length ? (winners[0].score + " очков") : "";

    const container = document.getElementById("final-standings");
    container.innerHTML = "";
    standings.forEach((entry, index) => {
      const row = document.createElement("div");
      const isTop3 = entry.rank <= 3;
      row.className = "standings-row" + (isTop3 ? " top3" : "") + (entry.rank === 1 ? " first" : "");
      row.style.animationDelay = (index * 150) + "ms";

      const place = document.createElement("div");
      place.className = "standings-place";
      place.textContent = "#" + entry.rank;

      const name = document.createElement("div");
      name.className = "standings-name";
      name.textContent = entry.name;

      const score = document.createElement("div");
      score.className = "standings-score";
      score.textContent = entry.score;

      row.appendChild(place);
      row.appendChild(name);
      row.appendChild(score);
      container.appendChild(row);
    });
  }

  renderPlayers([]);
  updateInfo();
  setInterval(updateInfo, 1000);
</script>
</body>
</html>
